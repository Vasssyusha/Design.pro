{% extends "base_generic.html" %}

{% block content %}
<h1>Удалить вариант оформления</h1>

<div class="panel">
    <p>Вы уверены, что хотите удалить вариант <strong>{{ proposal.title }}</strong>?</p>
    {% if proposal.get_room_type_display %}
    <p><strong>Тип помещения:</strong> {{ proposal.get_room_type_display }}</p>
    {% endif %}
</div>

<form method="post">
    {% csrf_token %}
    <a href="{% url 'proposals' %}" class="btn btn-default">Отмена</a>
    <input type="submit" value="Да, удалить" class="btn btn-danger">
</form>
{% endblock %}
