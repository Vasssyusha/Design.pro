{% extends "base_generic.html" %}

{% block content %}
<h1>{% if object %}Редактировать категорию{% else %}Добавить категорию{% endif %}</h1>

<form method="post">
    {% csrf_token %}
    <table>
        {{ form.as_table }}
    </table>
    <input type="submit" value="Сохранить" class="btn btn-primary">
    <a href="{% url 'categories' %}" class="btn btn-default">Отмена</a>
</form>
{% endblock %}
