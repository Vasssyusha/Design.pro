{% extends "base_generic.html" %}

{% block content %}
<h1>Удалить дизайнера</h1>
<p>Вы уверены, что хотите удалить "{{ designer.last_name }} {{ designer.first_name }}"?</p>
<form method="post">
    {% csrf_token %}
    <input type="submit" value="Да, удалить" class="btn btn-danger">
    <a href="{% url 'designers' %}" class="btn btn-default">Отмена</a>
</form>
{% endblock %}
