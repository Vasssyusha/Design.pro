{% extends "base_generic.html" %}

{% block content %}
<h1>Удалить помещение</h1>

<div class="panel">
    <p>Вы уверены, что хотите удалить помещение <strong>{{ room.title }}</strong>?</p>
    <p><strong>Тип:</strong> {{ room.get_room_type_display }}</p>
    {% if room.area %}
    <p><strong>Площадь:</strong> {{ room.area }} м²</p>
    {% endif %}
</div>

<form method="post">
    {% csrf_token %}
    <a href="{% url 'rooms' %}" class="btn btn-default">Отмена</a>
    <input type="submit" value="Да, удалить" class="btn btn-danger">
</form>
{% endblock %}
