{% extends "base_generic.html" %}

{% block content %}
<h1>Создать заявку на дизайн</h1>

<form method="post">
    {% csrf_token %}
    <table>
        {{ form.as_table }}
    </table>
    <input type="submit" value="Отправить заявку" class="btn btn-primary">
    <a href="{% url 'my-requests' %}" class="btn btn-default">Отмена</a>
</form>
{% endblock %}
