{% extends "base_generic.html" %}

{% block content %}
<h1>Удалить материал</h1>
<p>Вы уверены, что хотите удалить "{{ material.name }}"?</p>
<form method="post">
    {% csrf_token %}
    <input type="submit" value="Да, удалить" class="btn btn-danger">
    <a href="{% url 'materials' %}" class="btn btn-default">Отмена</a>
</form>
{% endblock %}
