{% extends "base_generic.html" %}

{% block content %}
<h1>Вход в систему</h1>

{% if form.errors %}
<div class="alert alert-danger">
    <strong>Ошибка!</strong> Неверный логин или пароль. Попробуйте ещё раз.
</div>
{% endif %}

<div class="panel" style="max-width: 400px;">
    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom: 16px;">
            <label for="username"><strong>Логин:</strong></label>
            <input type="text" name="username" id="username" required style="width: 100%; margin-top: 6px;">
        </div>
        <div style="margin-bottom: 16px;">
            <label for="password"><strong>Пароль:</strong></label>
            <input type="password" name="password" id="password" required style="width: 100%; margin-top: 6px;">
        </div>
        <button type="submit" class="btn btn-primary">Войти</button>
    </form>
    <p style="margin-top: 16px;">
        Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a>
    </p>
</div>
{% endblock %}
