{% extends "base_generic.html" %}

{% block content %}

<form method="post">
    {% csrf_token %}
    <table>
        {{ form.as_table }}

    <input type="submit" value="Зарегистрироваться" class="btn btn-primary">
</form>

<p>Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
{% endblock %}
